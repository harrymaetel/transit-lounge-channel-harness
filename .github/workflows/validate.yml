name: Harness validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python regression tests
        run: python3 -m unittest discover -s harness/tests -v
      - name: Native Figma helper regression tests
        run: node --test harness/tests/figma_helpers.test.js
      - name: Agent cards and draft contracts
        run: |
          python3 harness/scripts/harness.py validate-cards
          python3 harness/scripts/harness.py validate --job harness/examples/event-job.json
          python3 harness/scripts/harness.py validate --job harness/examples/playlist-job.json
          python3 harness/scripts/harness.py validate --job harness/examples/calendar-job.json
  font-setup:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read native font catalog without installing fonts
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, "harness/scripts/setup_fonts.py", "--check"], capture_output=True)
          print(result.stdout.decode("utf-8").encode("unicode_escape"))
          assert b"Neulis Alt" in result.stdout, result.stderr
          assert result.returncode in (0, 1), result.returncode
