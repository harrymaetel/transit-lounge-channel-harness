name: Repository operations log
on:
  push:
  create:
  delete:
  issues:
    types: [opened, closed, reopened, assigned, unassigned]
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft, synchronize]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: operations-log-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload;
            const issue_number = 1;
            if (p.issue?.number === issue_number) return;
            const marker = `<!-- operations-log:${context.runId} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100
            });
            if (comments.some(c => c.body?.includes(marker))) return;
            const clean = value => String(value ?? '-').replace(/[\r\n`<>]/g, ' ').replace(/@/g, '＠').slice(0, 200);
            const pr = p.pull_request;
            const item = pr || p.issue;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const target = pr ? `${base}/pull/${pr.number}` : p.issue ? `${base}/issues/${p.issue.number}` : `${base}/actions/runs/${context.runId}`;
            const ref = pr ? `${pr.head.ref} → ${pr.base.ref}` : p.ref || context.ref;
            const sha = pr?.head.sha || p.after || context.sha;
            const action = pr?.merged ? 'merged' : p.action || (p.deleted ? 'deleted' : p.created ? 'created' : 'updated');
            const body = [marker, `### ${new Date().toISOString()} · ${clean(context.eventName)} / ${clean(action)}`,
              `- 작업자: ${clean(context.actor)}`,
              `- 브랜치/참조: \`${clean(ref)}\``,
              `- SHA: \`${clean(sha)}\``,
              `- 대상: ${target}`,
              `- 실행: ${base}/actions/runs/${context.runId}`,
              item ? `- 번호: #${item.number}` : '',
              '- 시각은 로그 기록 시각(UTC)입니다. 원문·커밋 메시지는 수집하지 않습니다.'
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({...context.repo, issue_number, body});
